name: ci

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-test-package:
    name: ${{ matrix.os }} / ${{ matrix.tfm }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os:
          - windows-latest
          - macos-latest
          - ubuntu-latest
        tfm:
          - net10.0
          - net11.0
    steps:
      - uses: actions/checkout@v4

      # Some tests build net10.0 fixtures even in the net11.0 job.
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: |
            10.0.x
            11.0.x

      - name: Setup Zig (hot-path thin client shim)
        uses: mlugg/setup-zig@v2
        with:
          version: 0.17.1
      - name: Cache NuGet packages
        uses: actions/cache@v4
        with:
          path: ~/.nuget/packages
          key: nuget-${{ runner.os }}-${{ runner.arch }}-${{ matrix.tfm }}-${{ hashFiles('Directory.Build.props', '**/*.fsproj') }}

      - name: Install NativeAOT prerequisites (Linux)
        if: matrix.os == 'ubuntu-latest'
        run: sudo apt-get update && sudo apt-get install -y clang zlib1g-dev

      - name: Repository gate (build, NativeAOT publish, black-box tests, LF hygiene)
        shell: pwsh
        run: pwsh -NoProfile -File eng/gate.ps1 -Framework ${{ matrix.tfm }} -Filter 'Category!=Perf'

      - name: Package and verify the host bundle (net10.0)
        if: matrix.tfm == 'net10.0'
        shell: pwsh
        run: pwsh -NoProfile -File eng/package.ps1 -Framework net10.0

      - name: Upload distribution archive
        if: matrix.tfm == 'net10.0'
        uses: actions/upload-artifact@v4
        with:
          name: fsion-bundle-${{ matrix.os }}
          path: |
            artifacts/package/*.zip
            artifacts/package/*.tar.gz
          if-no-files-found: error
          retention-days: 7
